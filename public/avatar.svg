  <g stroke="#fff" stroke-opacity="0.5" stroke-width="1" fill="none">
    <rect x="60" y="70" width="200" height="200"/>
    <line x1="60" y1="70" x2="260" y2="270"/>
    <line x1="260" y1="70" x2="60" y2="270"/>
  </g>
  <text x="160" y="180" text-anchor="middle" font-family="monospace" font-size="42" fill="#fff">[R]</text>
  <text x="160" y="320" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="4" fill="rgba(255,255,255,0.7)">REPLACE WITH PHOTO</text>
